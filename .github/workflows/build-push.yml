name: Build and Push RunPod Worker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Runner Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update RunPod Serverless Template
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          IMAGE_TAG: "ghcr.io/${{ github.repository }}:${{ github.sha }}"
        run: |
          echo "Updating RunPod Template ($RUNPOD_TEMPLATE_ID) to tag: $IMAGE_TAG"

          PAYLOAD=$(jq -n \
            --arg id "$RUNPOD_TEMPLATE_ID" \
            --arg img "$IMAGE_TAG" \
            '{
              query: "mutation saveTemplate($input: SaveTemplateInput!) { saveTemplate(input: $input) { id imageName } }",
              variables: {
                input: {
                  id: $id,
                  imageName: $img
                }
              }
            }')

          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}")

          echo "RunPod API Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "Error updating RunPod template."
            exit 1
          fi
