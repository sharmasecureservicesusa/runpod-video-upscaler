name: Build and Push RunPod Worker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Runner Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Update RunPod Serverless Template
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          IMAGE_TAG: "ghcr.io/${{ github.repository }}:${{ github.sha }}"
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request

          api_key = os.environ["RUNPOD_API_KEY"]
          template_id = os.environ["RUNPOD_TEMPLATE_ID"]
          new_image = os.environ["IMAGE_TAG"]

          print(f"Fetching current configuration for template ID: {template_id}...")

          # 1. Fetch existing template settings
          query_get = """
          query {
            myself {
              podTemplates {
                id
                name
                imageName
                containerDiskInGb
                dockerArgs
                env {
                  key
                  value
                }
                volumeInGb
                isServerless
                containerRegistryAuthId
                readme
                ports
              }
            }
          }
          """

          req = urllib.request.Request(
              f"https://api.runpod.io/graphql?api_key={api_key}",
              data=json.dumps({"query": query_get}).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req) as response:
              res = json.loads(response.read().decode("utf-8"))

          if "errors" in res:
              raise Exception(f"Failed to fetch templates: {res['errors']}")

          templates = res.get("data", {}).get("myself", {}).get("podTemplates", [])
          target = next((t for t in templates if t["id"] == template_id), None)

          if not target:
              raise Exception(f"Template ID '{template_id}' not found in your RunPod account.")

          print(f"Found template '{target.get('name')}'. Updating image: '{target.get('imageName')}' -> '{new_image}'")

          # 2. Build full input payload with required fields
          input_data = {
              "id": target["id"],
              "name": target.get("name", "Serverless Template"),
              "imageName": new_image,
              "containerDiskInGb": target.get("containerDiskInGb") or 10,
              "dockerArgs": target.get("dockerArgs") if target.get("dockerArgs") is not None else "",
              "env": target.get("env") or [],
              "volumeInGb": target.get("volumeInGb") if target.get("volumeInGb") is not None else 0,
              "isServerless": target.get("isServerless", True)
          }

          if target.get("containerRegistryAuthId"):
              input_data["containerRegistryAuthId"] = target["containerRegistryAuthId"]
          if target.get("readme"):
              input_data["readme"] = target["readme"]
          if target.get("ports"):
              input_data["ports"] = target["ports"]

          # 3. Submit complete SaveTemplateInput mutation
          mutation_save = """
          mutation saveTemplate($input: SaveTemplateInput!) {
            saveTemplate(input: $input) {
              id
              name
              imageName
            }
          }
          """

          req_save = urllib.request.Request(
              f"https://api.runpod.io/graphql?api_key={api_key}",
              data=json.dumps({"query": mutation_save, "variables": {"input": input_data}}).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req_save) as response:
              res_save = json.loads(response.read().decode("utf-8"))

          if "errors" in res_save:
              raise Exception(f"RunPod API Error: {res_save['errors']}")

          updated = res_save.get("data", {}).get("saveTemplate", {})
          print(f"Successfully updated RunPod template '{updated.get('name')}' ({updated.get('id')}) to image: {updated.get('imageName')}")
          EOF
